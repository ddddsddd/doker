services:
  mcp:
    build: .
    container_name: claude-server-mcp
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./workspace:/workspace   # рабочая папка Claude
      - ./data:/data             # токены подключений и журнал действий (logs/audit.log)
      # Доступ к папкам самого сервера (хоста) — раскомментируйте только то, что нужно:
      # - /home:/host/home
      # - /var/www:/host/var/www
      # - /:/host                # ВЕСЬ диск сервера. Claude сможет менять любые файлы.
      # - /var/run/docker.sock:/var/run/docker.sock   # управление Docker. Это равно root-доступу к серверу.
    ports:
      # Только для самого сервера (127.0.0.1): сюда проксирует nginx/apache, если порты 80/443 заняты.
      - "127.0.0.1:${MCP_LOCAL_PORT:-8000}:8000"

  # Встроенный HTTPS. Запускается, только если в .env есть COMPOSE_PROFILES=caddy.
  # Нужны свободные порты 80 и 443.
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mcp

volumes:
  caddy_data:
  caddy_config:
