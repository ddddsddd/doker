# Режим «общий 443» (профиль sni): claude.ai подключается только к порту 443, а его занимает VPN.
# HAProxy читает имя домена из начала TLS-соединения (SNI), не расшифровывая трафик:
# соединения для DOMAIN идут в Caddy (с PROXY protocol, чтобы был виден IP клиента),
# все остальные — в VPN на VPN_PORT. Логи соединений не пишутся.
global
    log stdout format raw local0 notice

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend https_in
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    use_backend claude if { req_ssl_sni -i "${DOMAIN}" }
    default_backend vpn

backend claude
    server caddy "127.0.0.1:${CADDY_LOCAL_PORT}" send-proxy-v2

backend vpn
    server vpn "127.0.0.1:${VPN_PORT}"
